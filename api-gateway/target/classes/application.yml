server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: inventory-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: customer-route
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
        - id: billing-route
          uri: lb://billing-service
          predicates:
            - Path=/api/v1/billing/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}